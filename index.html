<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>香港布廠商會朱石麟中學科學小天地</title>
<meta name="description" content="每天一個科學小驚喜 · A daily science surprise for secondary students">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f4ee; --surface:#ffffff; --surface-2:#f0ede4; --ink:#1d2433; --muted:#5d6577;
    --line:#e3dfd3; --accent:#0f8b8d; --accent-ink:#ffffff; --accent-soft:#d9f0ef;
    --warn-bg:#fff4d6; --warn-ink:#6b4e00; --danger:#c0392b;
    --radius:16px; --shadow:0 1px 2px rgba(29,36,51,.06),0 6px 20px rgba(29,36,51,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --surface:#1b2029; --surface-2:#232937; --ink:#eef1f6; --muted:#a3acbd;
      --line:#2e3545; --accent:#3cc6c8; --accent-ink:#0b1a1b; --accent-soft:#163536;
      --warn-bg:#3a3017; --warn-ink:#f3d98b; --danger:#ff7b6b;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}

  /* Header */
  .top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
       backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
       border-bottom:1px solid var(--line)}
  .top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:8px;padding-bottom:8px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
  .brand svg{flex:none}
  .brand b{display:block;font-weight:900;font-size:1.05rem;line-height:1.3}
  @media (max-width:479px){ .brand b{font-size:.86rem;text-wrap:balance} .brand small{font-size:.68rem} }
  .brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:500;line-height:1.2}
  .spacer{flex:1}
  .lang-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
            padding:6px 14px;font-weight:700;font-size:.85rem;cursor:pointer;white-space:nowrap}
  .lang-btn:hover{border-color:var(--accent)}

  /* Tabs */
  .tabs{display:flex;gap:6px;padding:14px 0 4px}
  .tabs a{flex:1;max-width:220px;text-align:center;text-decoration:none;color:var(--muted);font-weight:700;
          padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1.5px solid transparent}
  .tabs a.active{color:var(--accent-ink);background:var(--accent)}
  .tabs a:not(.active):hover{border-color:var(--line);color:var(--ink)}

  .notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-size:.9rem}

  main{padding:8px 0 48px}
  h2{font-size:1.25rem;margin:0}

  /* Hero (today's fact) */
  .hero{margin-top:16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;
        display:grid;grid-template-columns:1fr;border:1px solid var(--line)}
  .hero-body{padding:22px 20px 22px}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.04em;
           color:var(--accent);text-transform:uppercase}
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .hero h1{font-size:clamp(1.5rem,4.6vw,2.2rem);line-height:1.25;margin:10px 0 10px;font-weight:900}
  .hero .text{font-size:1.05rem;white-space:pre-line;margin:0}
  .hero .video{margin:0}
  @media (min-width:860px){
    .hero.has-video{grid-template-columns:1.1fr 1fr}
    .hero.has-video .hero-media{order:2;padding:22px 22px 22px 0}
    .hero-body{padding:30px 30px}
  }
  .hero-media{padding:0 20px 20px}

  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:.85rem;color:var(--muted)}
  .topic{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;
         color:#fff;background:var(--c,#64748b)}

  /* Video */
  .video figcaption{font-size:.88rem;color:var(--muted);margin-top:8px}
  .yt-box{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
  .yt{all:unset;cursor:pointer;position:absolute;inset:0;background-size:cover;background-position:center;display:block}
  .yt::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.35))}
  .yt .play{position:absolute;left:50%;top:50%;width:68px;height:48px;transform:translate(-50%,-50%);z-index:1;
            background:#ff0033;border-radius:14px;transition:transform .15s}
  .yt .play::before{content:"";position:absolute;left:27px;top:14px;border-style:solid;border-width:10px 0 10px 17px;
                    border-color:transparent transparent transparent #fff}
  .yt:hover .play,.yt:focus-visible .play{transform:translate(-50%,-50%) scale(1.08)}
  .yt:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
  .yt-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .yt-link{display:inline-block;font-size:.82rem;margin-top:4px}

  .btn-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:700;text-decoration:none;
            padding:8px 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
  .btn-link:hover{filter:brightness(.97)}

  /* Pictures from the Sheet's "image" column */
  .pic{display:block;border-radius:14px;overflow:hidden;background:var(--surface-2)}
  .pic img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover}
  .card .pic img{aspect-ratio:16/9;max-height:none}
  .pic.n-pic{margin-top:8px;max-width:420px}

  /* Archive */
  .archive-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:36px 0 12px}
  .archive-head .count{color:var(--muted);font-size:.9rem}
  .search{flex:1 1 220px;max-width:360px;margin-left:auto;padding:10px 14px;border-radius:12px;
          border:1.5px solid var(--line);background:var(--surface)}
  .search:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;
        font-weight:700;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted));display:inline-block}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
        box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
  .card h3{margin:0;font-size:1.05rem;line-height:1.4}
  .card .text{margin:0;white-space:pre-line;font-size:.95rem}
  .clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .more-toggle{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:.88rem}
  .card .btn-link{margin-top:4px;align-self:flex-start;font-size:.88rem}
  .load-more{display:block;margin:20px auto 0;border:1.5px solid var(--line);background:var(--surface);
             padding:10px 22px;border-radius:12px;font-weight:700;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;grid-column:1/-1}

  /* Long fun-fact articles */
  .read-btn{display:inline-flex;align-items:center;gap:8px;margin-top:14px;text-decoration:none;font-weight:700;
            background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:12px}
  .read-btn small{font-weight:500;opacity:.85}
  .card .read-btn{align-self:flex-start;padding:8px 13px;font-size:.88rem;margin-top:4px}
  .mins{font-size:.82rem;color:var(--muted)}
  .article{max-width:760px;margin:16px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:22px;
           box-shadow:var(--shadow);padding:22px 20px 28px}
  @media (min-width:700px){ .article{padding:34px 44px 40px} }
  .article .back{display:inline-block;font-weight:700;text-decoration:none;margin-bottom:14px}
  .article h1{font-size:clamp(1.5rem,4.6vw,2.1rem);line-height:1.3;margin:8px 0 10px;font-weight:900}
  .article .lead-media{margin:20px 0 6px}
  .article .video{margin:0}
  .article .body{font-size:1.1rem;line-height:1.95}
  .points{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px;counter-reset:pt}
  .points li{counter-increment:pt;display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);
             border-radius:14px;padding:11px 14px;font-weight:700;font-size:1.04rem;line-height:1.5}
  .points li::before{content:counter(pt);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);
                     color:var(--accent-ink);font-size:.8rem;display:grid;place-items:center;margin-top:1px}
  .points-head{margin:18px 0 0;font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.03em}
  .card .points{margin-top:4px;gap:6px}
  .card .points li{font-size:.92rem;padding:8px 11px;font-weight:600}
  .card .points li::before{width:20px;height:20px;font-size:.72rem}
  .article .body h2{font-size:1.2rem;margin:28px 0 8px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.4}
  .article .body p{margin:0 0 14px}
  .article .body ul{margin:0 0 14px;padding-left:1.3em}
  .article .body li{margin:4px 0}
  .article .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
  .article .foot .btn-link{margin-top:0}

  /* Teacher zone */
  .lock{max-width:420px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;
        box-shadow:var(--shadow);padding:28px 24px;text-align:center}
  .lock .icon{width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent);
              display:grid;place-items:center;margin:0 auto 12px}
  .lock h2{margin-bottom:4px}
  .lock p{color:var(--muted);margin:0 0 18px}
  .lock form{display:flex;gap:8px}
  .lock input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
  .lock input:focus{outline:none;border-color:var(--accent)}
  .primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer}
  .err{color:var(--danger);font-size:.9rem;min-height:1.4em;margin-top:10px}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

  .t-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:24px 0 8px}
  .ghost{border:1.5px solid var(--line);background:transparent;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer}
  .group{margin-top:22px}
  .group > h3{font-size:1rem;margin:0 0 10px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .group > h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}
  .link-card{text-decoration:none;color:var(--ink);transition:transform .12s,border-color .12s}
  .link-card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .link-card .desc{color:var(--muted);font-size:.9rem;margin:0}
  .link-card .host{font-size:.78rem;color:var(--accent);font-weight:700;margin-top:auto;word-break:break-all}

  .tool{max-width:560px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}

  /* 4 tabs on small phones */
  @media (max-width:479px){ .tabs{gap:4px} .tabs a{padding:9px 4px;font-size:.86rem;border-radius:10px} }
  @media (max-width:479px){ .seg button{padding:7px 9px;font-size:.86rem} #lockBtn{padding:7px 10px} }

  /* 學與教資源 */
  .res-intro{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);
             border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .res-intro p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
  .res-group{margin-top:20px}
  .res-group > h3{font-size:1.05rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .res-group > h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}
  .res-card .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--c);align-self:flex-start}
  .res-card .desc{color:var(--muted);font-size:.9rem;margin:0}
  .res-card .btn-link{margin-top:auto;align-self:flex-start}
  /* Grade entry banners — stacked full-width bilingual cards */
  .grade-stack{display:flex;flex-direction:column;gap:12px;margin-top:16px}
  a.grade-card,.grade-card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;text-decoration:none;
    color:#fff;border:0;border-radius:18px;padding:18px 20px;min-height:104px;cursor:pointer;background:var(--gb,#1a4a84);
    box-shadow:0 8px 20px rgba(16,32,64,.16)}
  a.grade-card:visited,a.grade-card:hover{color:#fff;text-decoration:none}
  a.grade-card:hover{filter:brightness(1.08)}
  a.grade-card:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .grade-card.is-static{cursor:default;margin-top:10px}
  .grade-card.is-static:hover{filter:none}
  .grade-card .ico{flex:none;width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center}
  .grade-card .ico svg{display:block}
  .grade-card b{display:block;font-size:1.55rem;font-weight:900;line-height:1.25}
  .grade-card small{display:block;margin-top:2px;font-size:1.02rem;font-weight:700;opacity:.94}
  .grade-card.s1{--gb:#1a4a84}
  .grade-card.s2{--gb:#1e5eae}
  .grade-card.s3{--gb:#c53648}
  .res-back{display:inline-flex;align-items:center;margin-top:16px;font-weight:700;text-decoration:none}
  .res-tabs{display:flex;flex-wrap:nowrap;width:100%;margin-top:12px;overflow-x:auto;scrollbar-width:none}
  .res-tabs::-webkit-scrollbar{display:none}
  .res-tabs button{flex:1 0 auto;white-space:nowrap;line-height:1.35;text-align:center}
  .res-grid{display:grid;grid-template-columns:1fr;gap:12px}
  .pbl-body{padding:4px 18px 18px}
  .pbl-body > p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
  .pbl-lock{display:flex;gap:8px}
  .pbl-lock input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
  .pbl-lock input:focus{outline:none;border-color:var(--accent)}
  @media (max-width:479px){
    a.grade-card,.grade-card{padding:14px;min-height:86px;gap:12px;border-radius:16px}
    .grade-card .ico{width:56px;height:56px;border-radius:14px}
    .grade-card .ico svg{width:30px;height:30px}
    .grade-card b{font-size:1.28rem}
    .grade-card small{font-size:.92rem}
  }

  /* 教師專區 sub-tabs + worksheets */
  .seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .seg.res-tabs{display:flex;flex-wrap:nowrap;width:100%;overflow-x:auto}
  .ws-up{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .ws-up summary{cursor:pointer;padding:14px 18px;list-style:none;display:flex;align-items:center;gap:8px;color:var(--accent)}
  .ws-up summary::-webkit-details-marker{display:none}
  .ws-up summary span{font-size:1.3rem;line-height:1}
  .ws-up[open] summary{border-bottom:1px solid var(--line)}
  .ws-form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:16px 18px 18px}
  .ws-form label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700;color:var(--muted);min-width:0}
  .ws-form .wide{grid-column:1/-1}
  .ws-form input,.ws-form select{font-weight:400;color:var(--ink);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);min-width:0}
  .ws-form input[type=file]{padding:8px}
  .ws-form input:focus,.ws-form select:focus{outline:none;border-color:var(--accent)}
  @media (max-width:520px){ .ws-form{grid-template-columns:1fr} }
  .ws-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ws-msg{font-size:.9rem;font-weight:700}
  .ws-msg.ok{color:#1f9d6b} .ws-msg.bad{color:var(--danger)}
  .primary:disabled{opacity:.6;cursor:wait}
  .ws-sec{margin-top:20px}
  .ws-sec > h3{font-size:1.05rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .ws-sec > h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent)}
  .ws-term{font-size:.85rem;font-weight:700;color:var(--muted);margin:12px 0 6px}
  .ws-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 16px}
  .ws-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
  .ws-item:first-child{border-top:0}
  .ws-ico{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:.7rem;font-weight:900;color:#fff;background:var(--c)}
  .ws-info{flex:1;min-width:0}
  .ws-info b{display:block;line-height:1.4;word-break:break-word}
  .ws-info small{display:block;color:var(--muted);font-size:.8rem;word-break:break-all}
  .ws-btns{display:flex;gap:6px;flex:none}
  .ws-btns a,.ws-btns button{font-size:.85rem;font-weight:700;padding:7px 11px;border-radius:9px;text-decoration:none;cursor:pointer;white-space:nowrap}
  .ws-btns a{background:var(--accent-soft);color:var(--accent)}
  .ws-btns button{border:1.5px solid var(--line);background:transparent;color:var(--muted)}
  .ws-btns button.confirm{border-color:var(--danger);color:#fff;background:var(--danger)}
  @media (max-width:520px){ .ws-item{flex-wrap:wrap} .ws-btns{width:100%;padding-left:52px} }
  .tool code{display:block;word-break:break-all;background:var(--surface-2);padding:12px;border-radius:10px;margin:12px 0;font-size:.85rem}

  /* Notices (重要信息) */
  .notices{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid #e0a100;
           border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .notices-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .notices-head h2{font-size:1.05rem}
  .notice-item{padding:10px 0;border-top:1px dashed var(--line)}
  .notice-item:first-of-type{border-top:0}
  .notice-item .n-meta{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
  .pin{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:#e0a100;color:#fff}
  .notice-item h3{margin:2px 0 0;font-size:1rem;line-height:1.45}
  .notice-item p{margin:4px 0 0;white-space:pre-line;font-size:.93rem}
  .notice-item a{font-size:.88rem;font-weight:700}
  .n-count{margin-left:auto;font-size:.8rem;color:var(--muted);font-weight:700}
  .n-viewport{overflow:hidden}
  .n-track{display:flex;align-items:flex-start;transition:transform .55s ease}
  .n-slide{flex:0 0 100%;min-width:0;border-top:0!important;padding:4px 2px 6px}
  .n-dots{display:flex;justify-content:center;gap:4px;margin-top:6px}
  .n-dot{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center}
  .n-dot::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--line);transition:width .25s,background .25s}
  .n-dot[aria-current="true"]::before{width:22px;background:#e0a100}
  .n-dot:focus-visible{outline:2px solid var(--accent);border-radius:6px}
  /* Optional YouTube on a notice — same player as fun facts, kept as narrow as notice photos */
  .notice-item .video{margin:8px 0 0;max-width:420px}
  .notice-item .yt-box{border-radius:10px}
  .notice-item .video figcaption{margin-top:4px;font-size:.8rem}
  .notice-item .video + a{display:inline-block;margin-top:6px}
  @media (prefers-reduced-motion: reduce){ .n-track,.n-viewport{transition:none} }

  /* Notices + Upcoming row on the home page */
  .info-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:16px}
  .info-row > div:empty{display:none}
  .info-row .notices{margin-top:0;height:100%}
  .upcoming{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);
            border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;height:100%}
  .upcoming .notices-head a{margin-left:auto;font-size:.85rem;font-weight:700;text-decoration:none}

  /* Calendar (行事曆) */
  .ev-dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
  .ev{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
  .ev:first-of-type{border-top:0}
  .ev-date{flex:none;width:54px;text-align:center;border-radius:12px;padding:4px 0;background:var(--surface-2)}
  .ev-date b{display:block;font-size:1.3rem;line-height:1.1}
  .ev-date small{display:block;font-size:.72rem;color:var(--muted)}
  .ev-body{min-width:0;flex:1}
  .ev-body h3{margin:0;font-size:1rem;line-height:1.4}
  .ev-body p{margin:3px 0 0;font-size:.9rem;color:var(--muted);white-space:pre-line}
  .ev-tag{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;color:var(--muted)}
  .ev-when{font-size:.8rem;color:var(--muted)}
  .ev-soon{font-size:.75rem;font-weight:700;color:var(--accent);margin-left:6px}
  .ev-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 18px}
  .cal{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-top:16px}
  .cal-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cal-head h2{min-width:130px;text-align:center}
  .cal-nav{font-size:1.2rem;line-height:1;padding:6px 14px}
  #calToday{margin-left:auto}
  .cal-legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 6px;font-size:.8rem;color:var(--muted)}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
  .cal-wd{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);padding:4px 0}
  .cal-day{min-height:58px;border-radius:10px;background:var(--surface-2);padding:4px;font-size:.8rem;position:relative;overflow:hidden}
  .cal-day.out{background:transparent}
  .cal-day .num{font-weight:700}
  .cal-day.today{outline:2px solid var(--accent);outline-offset:-2px}
  .cal-day.today .num{color:var(--accent)}
  .cal-day .chips-d{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
  .cal-day .lbl{display:block;font-size:.7rem;line-height:1.3;color:#fff;background:var(--c);border-radius:5px;padding:1px 4px;
                margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:639px){ .cal-day .lbl{display:none} .cal-day{min-height:46px} }
  @media (min-width:640px){ .cal-day .chips-d{display:none} .cal-day{min-height:86px} }

  .status{text-align:center;color:var(--muted);padding:60px 10px}
  footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center;padding:22px 16px 30px}
  [hidden]{display:none!important}
</style>
</head>

function ytId(u) {

  return m ? m[1] : "";
}

function todayHK() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Hong_Kong" }).format(new Date()); }
function normDate(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);           // HK style: day/month/year
  if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
function fmtDate(iso) {
  const [y, mo, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, mo - 1, d));
  return state.lang === "zh"
    ? `${y}年${mo}月${d}日`
    : dt.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
function topicKey(raw) {
  const r = String(raw || "").trim().toLowerCase();
  if (!r) return "general";
  for (const [k, v] of Object.entries(TOPICS)) if (r === k || r === v.en.toLowerCase() || r === v.zh) return k;
  return "x:" + String(raw).trim();
}
function topicInfo(key) {
  if (TOPICS[key]) return { label: TOPICS[key][state.lang], c: TOPICS[key].c };
  return { label: key.slice(2), c: "#5f6b7d" };
}

/* CSV parser (handles quotes, commas and line breaks inside cells) */
function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); rows.push(row); row = []; f = "";
    } else f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim().toLowerCase().split(/\s+/)[0]);   // "title_zh 標題" → "title_zh"
  return rows.slice(1).filter(r => r.some(x => x.trim())).map(r => {
    const o = {}; head.forEach((h, i) => { if (h) o[h] = (r[i] || "").trim(); }); return o;
  });
}
async function getCSV(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return parseCSV(await res.text());
}

async function load() {
  $("#status").hidden = false;
  $("#status").textContent = t("loading");
  try {
    const usingSample = !CONFIG.FACTS_CSV_URL && !CONFIG.LINKS_CSV_URL;
    const [f, l] = await Promise.all([
      CONFIG.FACTS_CSV_URL ? getCSV(CONFIG.FACTS_CSV_URL) : Promise.resolve(usingSample ? SAMPLE_FACTS : []),
      CONFIG.LINKS_CSV_URL ? getCSV(CONFIG.LINKS_CSV_URL) : Promise.resolve(usingSample ? SAMPLE_LINKS : [])
    ]);
    const today = todayHK();
    state.facts = f.map(r => ({ ...r, date: normDate(r.date), tk: topicKey(r.topic) }))
                   .filter(r => r.date && r.date <= today && (r.title_zh || r.title_en || r.fact_zh || r.fact_en))
                   .sort((a, b) => b.date.localeCompare(a.date));
    state.links = l.filter(r => safeUrl(r.url) && (r.title_zh || r.title_en));
    // Notices load separately so a problem with that tab never breaks the rest of the site
    const n = CONFIG.NOTICES_CSV_URL ? await getCSV(CONFIG.NOTICES_CSV_URL).catch(err => { console.error(err); return []; }) : [];
    state.notices = n.map(r => ({ ...r, date: normDate(r.date), until: normDate(r.until), pinned: /^(y|yes|是|1|true)$/i.test((r.pin || "").trim()) }))
                     .filter(r => r.date && r.date <= today && (!r.until || r.until >= today) && (r.title_zh || r.title_en))
                     .sort((a, b) => (b.pinned - a.pinned) || b.date.localeCompare(a.date));
    // Calendar also loads separately
    const rs = CONFIG.RESOURCES_CSV_URL ? await getCSV(CONFIG.RESOURCES_CSV_URL).catch(err => { console.error(err); return []; }) : [];
    state.res = rs.map(r => ({ ...r, from: normDate(r.show_from) }))
                  .filter(r => safeUrl(r.link) && (r.title_zh || r.title_en) && (!r.from || r.from <= today));
    const c = CONFIG.CALENDAR_CSV_URL ? await getCSV(CONFIG.CALENDAR_CSV_URL).catch(err => { console.error(err); return []; }) : [];
    state.events = c.map(r => { const d = normDate(r.date), e = normDate(r.end_date);
                                return { ...r, date: d, end: e && e >= d ? e : d, ty: eventType(r.type) }; })
                    .filter(r => r.date && (r.title_zh || r.title_en))
                    .sort((a, b) => a.date.localeCompare(b.date) || a.end.localeCompare(b.end));
    state.loaded = true;
    $("#notice").hidden = !usingSample;
    $("#status").hidden = true;
    render();
  } catch (e) {
    console.error(e);
    $("#status").innerHTML = `${esc(t("loadErr"))}<br><br><button class="primary" type="button" onclick="load()">${esc(t("retry"))}</button>`;
  }
}

/* ---------- calendar ---------- */
function eventType(raw) {
  const r = String(raw || "").trim().toLowerCase();
  for (const [k, v] of Object.entries(EVENT_TYPES)) if (r === k || r === v.en.toLowerCase() || r === v.zh) return k;
  return "other";
}
const isoOf = (y, m, d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
function daysBetween(a, b) {   // b - a in days, ISO strings
  const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((p(b) - p(a)) / 86400000);
}
function whenText(ev) {
  if (ev.end !== ev.date) return `${fmtDate(ev.date)} – ${fmtDate(ev.end)}`;
  return fmtDate(ev.date);
}
function soonText(ev, today) {
  if (ev.date <= today && ev.end >= today) return ev.date === ev.end ? t("todayIs") : t("ongoing");
  const n = daysBetween(today, ev.date);
  return n > 0 && n <= 30 ? t("daysLeft")(n) : "";
}
function evHTML(ev, today) {
  const ty = EVENT_TYPES[ev.ty], [, mo, d] = ev.date.split("-").map(Number), u = safeUrl(ev.link), note = L(ev, "note"), soon = soonText(ev, today);
  return `<div class="ev">
    <div class="ev-date" style="border-top:3px solid ${ty.c}"><b>${d}</b><small>${state.lang === "zh" ? mo + "月" : new Date(Date.UTC(2000, mo - 1, 1)).toLocaleDateString("en-GB", { month: "short", timeZone: "UTC" })}</small></div>
    <div class="ev-body">
      <span class="ev-tag"><i class="ev-dot" style="--c:${ty.c}"></i>${esc(ty[state.lang])}</span>${soon ? `<span class="ev-soon">${esc(soon)}</span>` : ""}
      <h3>${esc(L(ev, "title"))}</h3>
      <div class="ev-when">${esc(whenText(ev))}</div>
      ${note ? `<p>${esc(note)}</p>` : ""}
      ${u ? `<a href="${esc(u)}" target="_blank" rel="noopener" style="font-size:.88rem;font-weight:700">${esc(t("details"))} ↗</a>` : ""}
    </div></div>`;
}
function renderUpcoming() {
  const today = todayHK();
  const list = state.events.filter(e => e.end >= today).slice(0, CONFIG.UPCOMING_SHOWN);
  $("#upcoming").innerHTML = list.length ? `<section class="upcoming" aria-label="${esc(t("upcoming"))}">
    <div class="notices-head"><span aria-hidden="true">📅</span><h2>${esc(t("upcoming"))}</h2><a href="#calendar">${esc(t("viewCal"))}</a></div>
    ${list.map(e => evHTML(e, today)).join("")}
  </section>` : "";
}
function renderCalendar() {
  const today = todayHK();
  if (!state.calY) { const [y, m] = today.split("-").map(Number); state.calY = y; state.calM = m; }
  const y = state.calY, m = state.calM;
  $("#calTitle").textContent = t("monthTitle")(y, m);
  $("#calLegend").innerHTML = Object.values(EVENT_TYPES).map(v => `<span><i class="ev-dot" style="--c:${v.c}"></i>${esc(v[state.lang])}</span>`).join("");
  const first = isoOf(y, m, 1), days = new Date(Date.UTC(y, m, 0)).getUTCDate(), last = isoOf(y, m, days);
  const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const inMonth = state.events.filter(e => e.date <= last && e.end >= first);
  let cells = t("weekdays").map(w => `<div class="cal-wd">${esc(w)}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += `<div class="cal-day out"></div>`;
  for (let d = 1; d <= days; d++) {
    const iso = isoOf(y, m, d), evs = inMonth.filter(e => e.date <= iso && e.end >= iso);
    cells += `<div class="cal-day ${iso === today ? "today" : ""}"><span class="num">${d}</span>
      ${evs.slice(0, 3).map(e => `<span class="lbl" style="--c:${EVENT_TYPES[e.ty].c}" title="${esc(L(e, "title"))}">${esc(L(e, "title"))}</span>`).join("")}
      ${evs.length > 3 ? `<span class="lbl" style="--c:var(--muted)">+${evs.length - 3}</span>` : ""}
      ${evs.length ? `<span class="chips-d">${evs.slice(0, 4).map(e => `<i class="ev-dot" style="--c:${EVENT_TYPES[e.ty].c}"></i>`).join("")}</span>` : ""}
    </div>`;
  }

  $("#calList").innerHTML = inMonth.length ? inMonth.map(e => evHTML(e, today)).join("") : `<div class="empty">${esc(t("noEvents"))}</div>`;
}
function shiftMonth(n) {
  let m = state.calM + n, y = state.calY;
  while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; }
  state.calY = y; state.calM = m; renderCalendar();
}

  </section>`;
  const sec = box.querySelector(".notices");
  sec.addEventListener("mouseenter", () => { state.nHover = true; });
  sec.addEventListener("mouseleave", () => { state.nHover = false; });
  sec.addEventListener("focusin", () => { state.nHover = true; });
  sec.addEventListener("focusout", () => { state.nHover = false; });
  let x0 = null;
  sec.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; state.nHover = true; }, { passive: true });
  sec.addEventListener("touchend", e => {
    state.nHover = false; if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { goNotice(state.nIdx + (dx < 0 ? 1 : -1)); restartNoticeTimer(); }
  });
  // re-measure whenever a notice changes size (web font, picture, video thumbnail, screen rotating)
  sec.querySelectorAll("img").forEach(im => im.addEventListener("load", fitNotices));
  sec.querySelectorAll(".yt").forEach(btn => {
    const im = new Image();
    im.onload = im.onerror = fitNotices;
    im.src = `https://i.ytimg.com/vi/${btn.dataset.id}/hqdefault.jpg`;
  });
  if (window.ResizeObserver) { state.nRO?.disconnect(); state.nRO = new ResizeObserver(fitNotices); sec.querySelectorAll(".n-slide").forEach(s => state.nRO.observe(s)); }
  document.fonts?.ready.then(fitNotices);
  goNotice(state.nIdx, true);
  restartNoticeTimer();
}

/* carousel helpers */
function goNotice(i, instant) {
  const track = $(".n-track"), vp = $(".n-viewport"); if (!track) return;
  const slides = track.children, n = slides.length; if (!n) return;
  state.nIdx = ((i % n) + n) % n;
  if (instant) track.style.transition = "none";
  track.style.transform = `translateX(-${state.nIdx * 100}%)`;
  fitNotices();
  if (instant) { void track.offsetWidth; track.style.transition = ""; }
  [...slides].forEach((s, k) => s.setAttribute("aria-hidden", k !== state.nIdx));
  document.querySelectorAll(".n-dot").forEach((d, k) => d.setAttribute("aria-current", k === state.nIdx));
  const c = $("#nCount"); if (c) c.textContent = `${state.nIdx + 1} / ${n}`;
}
// keep the box as tall as the tallest notice, so nothing is cut off and the page below never jumps while sliding
function fitNotices() {
  const vp = $(".n-viewport"), track = $(".n-track"); if (!vp || !track) return;
  const h = Math.max(0, ...[...track.children].map(s => s.offsetHeight));
  if (h) vp.style.height = h + "px";          // h is 0 while the page is hidden (e.g. on another tab) — keep the old value
}
function restartNoticeTimer() {
  clearInterval(state.nTimer);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !$(".n-track") || $(".n-track").children.length < 2) return;
  state.nTimer = setInterval(() => {
    // leave a notice alone while its video is playing, same as while the pointer is over the carousel
    if (!state.nHover && !document.hidden && !$(".n-slide[aria-hidden='false'] iframe")) goNotice(state.nIdx + 1);
  }, CONFIG.NOTICE_SECONDS * 1000);
}

/* ---------- long articles ---------- */
// A fact counts as an article when it has paragraphs / sub-headings or takes 2+ minutes to read.
function readMins(text) {
  const han = (text.match(/[㐀-鿿]/g) || []).length;
  const words = (text.replace(/[㐀-鿿]/g, " ").match(/[A-Za-z0-9]+/g) || []).length;
  return Math.max(1, Math.round(han / 400 + words / 200));
}
const isArticle = f => { const x = L(f, "fact"); return /\n\s*\n|^#{2,3}\s/m.test(x) || readMins(x) >= 2; };
function summaryOf(f) {
  const s = L(f, "summary"); if (s) return s;
  const para = L(f, "fact").split(/\n\s*\n/).map(p => p.trim()).find(p => p && !/^#{2,3}\s/.test(p)) || "";
  return para.replace(/\*\*/g, "").replace(/^[-•・]\s+/gm, "");
}
// Simple formatting for article text: blank line = new paragraph, "## " = sub-heading, "- " = bullet point
function richText(text) {
  const out = []; let para = [], list = [];
  const flushP = () => { if (para.length) { out.push(`<p>${para.map(esc).join("<br>")}</p>`); para = []; } };
  const flushL = () => { if (list.length) { out.push(`<ul>${list.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`); list = []; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trim().replace(/\*\*/g, "");
    if (!line) { flushP(); flushL(); continue; }
    if (/^#{2,3}\s+/.test(line)) { flushP(); flushL(); out.push(`<h2>${esc(line.replace(/^#+\s+/, ""))}</h2>`); continue; }
    if (/^[-•・]\s+/.test(line)) { flushP(); list.push(line.replace(/^[-•・]\s+/, "")); continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL(); return out.join("");
}
// Key points: one per line in points_zh / points_en ("- " at the start is optional)
function pointsOf(f) {
  return L(f, "points").split("\n").map(x => x.trim().replace(/^[-•・]\s*/, "").replace(/^\d+[.、)]\s*/, "")).filter(Boolean).slice(0, 5);
}
function pointsHTML(f, head) {
  const ps = pointsOf(f); if (!ps.length) return "";
  return `${head ? `<div class="points-head">${esc(t("keyPoints"))}</div>` : ""}<ol class="points">${ps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>`;
}
function readBtn(f) {
  return `<a class="read-btn" href="#read/${esc(f.date)}">${esc(t("readFull"))} <small>· ${esc(t("minRead")(readMins(L(f, "fact"))))}</small></a>`;
}

/* ---------- 教師專區: worksheets (via the Apps Script back end) ---------- */
const WS_GRADES = ["中一", "中二", "中三"], WS_TERMS = ["上學期", "下學期"];
const TERM_EN = { "上學期": "1st term", "下學期": "2nd term" };
const termLabel = x => state.lang === "en" ? (TERM_EN[x] || x) : x;

async function wsCall(body) {
  let res;
  try {
    // text/plain body keeps this a "simple" request, which Apps Script web apps accept from any site
    res = await fetch(CONFIG.WORKSHEET_API, { method: "POST", body: JSON.stringify({ ...body, passcode: state.pass }) });
  } catch (e) { throw new Error("NET"); }
  let j; try { j = await res.json(); } catch (e) { throw new Error("NET"); }
  if (!j.ok) throw new Error(j.error || "NET");
  return j;
}
function wsError(e) {
  const code = e && e.message;
  if (code === "BAD_PASSCODE") {           // passcode changed on the server → ask again
    state.unlocked = false; state.pass = "";
    try { sessionStorage.removeItem("sd_teacher"); sessionStorage.removeItem("sd_pass"); } catch (x) {}
    renderTeachers(); $("#lockErr").textContent = t("wsErr").BAD_PASSCODE;
  }
  return t("wsErr")[code] || t("wsErr").NET;
}
async function loadWs() {
  if (state.wsLoading || !CONFIG.WORKSHEET_API) return;
  state.wsLoading = true; state.wsErr = ""; renderWsList(); renderPblFiles();
  try { state.ws = (await wsCall({ action: "list" })).files || []; }
  catch (e) {
    state.ws = null; state.wsErr = wsError(e);
    $("#wsList").innerHTML = `<div class="empty">${esc(state.wsErr)}</div>`;
    state.wsLoading = false; renderPblFiles();
    if (!state.unlocked) renderResources();
    return;
  }
  state.wsLoading = false; renderWsList(); renderPblFiles();
}
function fileKind(f) {
  const ext = (f.name.split(".").pop() || "").toLowerCase();
  if (ext === "pdf") return ["PDF", "#d64545"];
  if (/^docx?$/.test(ext)) return ["DOC", "#2f6fdb"];
  if (/^pptx?$/.test(ext)) return ["PPT", "#d9822b"];
  if (/^xlsx?$/.test(ext)) return ["XLS", "#1f9d6b"];
  if (/^(jpe?g|png|heic|gif|webp)$/.test(ext)) return ["IMG", "#7c55d6"];
  return [ext.slice(0, 4).toUpperCase() || "FILE", "#5f6b7d"];
}
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
function renderWsList() {
  chipRow($("#wsGrades"), t("allGrades"), WS_GRADES, state.wsGrade, gradeLabel, "data-wg");
  chipRow($("#wsTerms"), t("wsAllTerms"), WS_TERMS, state.wsTerm, termLabel, "data-wt");
  if (state.ws === null) { if (state.wsLoading) $("#wsList").innerHTML = `<div class="empty">${esc(t("wsLoading"))}</div>`; return; }
  const q = state.wsQ.trim().toLowerCase();
  const files = state.ws.filter(f => (state.wsGrade === "all" || f.grade === state.wsGrade) && (state.wsTerm === "all" || f.term === state.wsTerm) &&
    (!q || [f.title, f.name, f.teacher].join(" ").toLowerCase().includes(q)));
  const grades = WS_GRADES.filter(g => state.wsGrade === "all" || g === state.wsGrade);
  const out = grades.map(g => {
    const terms = WS_TERMS.filter(x => state.wsTerm === "all" || x === state.wsTerm).map(term => {
      const fs = files.filter(f => f.grade === g && f.term === term);
      if (!fs.length && (q || state.wsGrade === "all")) return "";
      return `<div class="ws-term">${esc(termLabel(term))}</div>
        <div class="ws-box">${fs.length ? fs.map(f => { const [k, c] = fileKind(f), sure = state.wsDel === f.id;
          return `<div class="ws-item">
            <span class="ws-ico" style="--c:${c}">${esc(k)}</span>
            <div class="ws-info"><b>${esc(f.title)}</b>
              <small>${esc([f.name !== f.title ? f.name : "", f.teacher, fmtDate(f.date), fmtSize(f.size)].filter(Boolean).join(" · "))}</small></div>
            <div class="ws-btns"><a href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">${esc(t("wsOpen"))} ↗</a>
              <button type="button" class="${sure ? "confirm" : ""}" data-wsdel="${esc(f.id)}">${esc(t(sure ? "wsDelSure" : "wsDel"))}</button></div>
          </div>`; }).join("") : `<div class="empty" style="padding:16px">${esc(t("wsEmpty"))}</div>`}</div>`;
    }).join("");
    return terms ? `<section class="ws-sec"><h3>${esc(gradeLabel(g))}</h3>${terms}</section>` : "";
  }).join("");
  $("#wsList").innerHTML = out || `<div class="empty">${esc(t("wsEmpty"))}</div>`;
}
function fillWsForm() {
  const keep = (sel, v) => { const el = $(sel); return el.value || v; };
  let mem = {}; try { mem = JSON.parse(localStorage.getItem("sd_ws") || "{}"); } catch (e) {}
  const g = keep("#wsFGrade", mem.grade || "中一"), tm = keep("#wsFTerm", mem.term || "上學期");
  $("#wsFGrade").innerHTML = WS_GRADES.map(x => `<option value="${x}" ${x === g ? "selected" : ""}>${esc(gradeLabel(x))}</option>`).join("");
  $("#wsFTerm").innerHTML = WS_TERMS.map(x => `<option value="${x}" ${x === tm ? "selected" : ""}>${esc(termLabel(x))}</option>`).join("");
  if (!$("#wsFTeacher").value && mem.teacher) $("#wsFTeacher").value = mem.teacher;
}

function renderTeachers() {
  $("#lockBox").hidden = state.unlocked;
  $("#teacherArea").hidden = !state.unlocked;
  if (!state.unlocked) return;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", b.dataset.tz === state.tz));
  $("#tzWs").hidden = state.tz !== "ws"; $("#tzLinks").hidden = state.tz !== "links";
  if (state.tz === "ws") {
    $("#wsOff").hidden = !!CONFIG.WORKSHEET_API; $("#wsOn").hidden = !CONFIG.WORKSHEET_API;
    if (CONFIG.WORKSHEET_API) { fillWsForm(); renderWsList(); if (state.ws === null && !state.wsLoading) loadWs(); }
  }
  const q = state.linkQ.trim().toLowerCase();
  const links = state.links.filter(r => !q ||
    [r.title_zh, r.title_en, r.description_zh, r.description_en, r.category_zh, r.category_en, r.url].join(" ").toLowerCase().includes(q));
  const groups = new Map();
  links.forEach(r => { const g = L(r, "category") || t("other"); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(r); });
  $("#linkGroups").innerHTML = groups.size ? [...groups].map(([g, rs]) => `<section class="group">
      <h3>${esc(g)}</h3>
      <div class="grid">${rs.map(r => { const u = safeUrl(r.url); let host = ""; try { host = new URL(u).hostname.replace(/^www\./, ""); } catch (e) {}
        return `<a class="card link-card" href="${esc(u)}" target="_blank" rel="noopener">
          <h3>${esc(L(r, "title"))}</h3>${L(r, "description") ? `<p class="desc">${esc(L(r, "description"))}</p>` : ""}
          <span class="host">${esc(host)} ↗</span></a>`; }).join("")}</div>
    </section>`).join("") : `<div class="empty">${esc(t("noLinks"))}</div>`;
}

function applyStatic() {
  document.documentElement.lang = state.lang === "zh" ? "zh-Hant-HK" : "en";
  document.title = CONFIG.SITE_NAME[state.lang];
  $("#siteName").textContent = CONFIG.SITE_NAME[state.lang];
  $("#siteTagline").textContent = CONFIG.SITE_TAGLINE[state.lang];
  $("#footer").textContent = CONFIG.FOOTER[state.lang];
  $("#langBtn").textContent = state.lang === "zh" ? "EN" : "中文";
  $("#langBtn").setAttribute("aria-label", state.lang === "zh" ? "Switch to English" : "切換至中文");
  $("#notice").textContent = t("sample");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
}

function render() {
  applyStatic();
  const [route, param] = hashParts();
  const view = ["facts", "read", "resources", "calendar", "teachers", "make-passcode"].includes(route) ? route : "facts";
  document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== "view-" + view || (!state.loaded && view !== "make-passcode"));
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("active", a.dataset.route === (view === "read" ? "facts" : view)));
  if (!state.loaded) return;
  if (view === "facts") { renderNotices(); renderUpcoming(); renderHero(); renderChips(); renderArchive(); }
  if (view === "read") renderRead(param);
  if (view === "calendar") renderCalendar();
  if (view === "resources") renderResources();
  if (view === "teachers") renderTeachers();
}

/* ---------- passcode ---------- */
async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- events ---------- */
$("#langBtn").addEventListener("click", () => {
  state.lang = state.lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("sd_lang", state.lang); } catch (e) {}
  render();
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
window.addEventListener("resize", fitNotices);

$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  state.topic = b.dataset.topic; state.shown = CONFIG.PAGE_SIZE; renderChips(); renderArchive();
});
$("#factSearch").addEventListener("input", e => { state.q = e.target.value; state.shown = CONFIG.PAGE_SIZE; renderArchive(); });
$("#moreBtn").addEventListener("click", () => { state.shown += CONFIG.PAGE_SIZE; renderArchive(); });
$("#linkSearch").addEventListener("input", e => { state.linkQ = e.target.value; renderTeachers(); });
$("#resSearch").addEventListener("input", e => { state.resQ = e.target.value; renderResources(); });
$("#resTabs").addEventListener("click", e => { const b = e.target.closest("[data-rc]"); if (b) { state.resCat = b.dataset.rc; renderResources(); } });
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-tz]"); if (b) { state.tz = b.dataset.tz; renderTeachers(); } });
$("#wsGrades").addEventListener("click", e => { const b = e.target.closest("[data-wg]"); if (b) { state.wsGrade = b.dataset.wg; renderWsList(); } });
$("#wsTerms").addEventListener("click", e => { const b = e.target.closest("[data-wt]"); if (b) { state.wsTerm = b.dataset.wt; renderWsList(); } });
$("#wsSearch").addEventListener("input", e => { state.wsQ = e.target.value; renderWsList(); });
$("#wsList").addEventListener("click", async e => {
  const b = e.target.closest("[data-wsdel]"); if (!b) return;
  const id = b.dataset.wsdel;
  if (state.wsDel !== id) { state.wsDel = id; renderWsList(); return; }   // first click asks "Sure?"
  b.disabled = true;
  try { await wsCall({ action: "delete", id }); state.ws = state.ws.filter(f => f.id !== id); state.wsDel = ""; renderWsList(); }
  catch (err) { b.disabled = false; b.textContent = wsError(err); }
});
$("#pblLock").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#pblPass").value.trim(), err = $("#pblLockErr");
  if (!v) return;
  if (!window.crypto?.subtle) { err.textContent = t("noCrypto"); return; }
  if (await sha256(v) === CONFIG.TEACHER_PASSCODE_HASH) {
    state.unlocked = true; state.pass = v; state.wsErr = "";
    try { sessionStorage.setItem("sd_teacher", CONFIG.TEACHER_PASSCODE_HASH); sessionStorage.setItem("sd_pass", v); } catch (e) {}
    $("#pblPass").value = ""; err.textContent = "";
    renderResources();
  } else {
    err.textContent = t("wrong");
    const box = $("#pblLock"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  }
});
$("#pblForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#pblMsg"), btn = $("#pblSubmit"), file = $("#pblFile").files[0];
  const show = (txt, ok) => { msg.textContent = txt; msg.className = "ws-msg " + (ok ? "ok" : "bad"); };
  const title = $("#pblTitle").value.trim(), teacher = $("#pblTeacher").value.trim();
  if (!title) return show(t("wsErr").NO_TITLE);
  if (!file) return show(t("wsErr").NO_FILE);
  if (file.size > CONFIG.WORKSHEET_MAX_MB * 1048576) return show(t("wsErr").TOO_BIG);
  btn.disabled = true; btn.textContent = t("wsSending"); msg.textContent = "";
  try {
    const data = await new Promise((ok, bad) => { const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = bad; r.readAsDataURL(file); });
    await wsCall({ action: "upload", grade: "中三", term: PBL_CAT, title, teacher, filename: file.name, mime: file.type, data });
    show(t("wsDone"), true);
    $("#pblTitle").value = ""; $("#pblFile").value = "";
    state.ws = null; state.wsErr = ""; loadWs();
  } catch (err) { show(wsError(err)); if (!state.unlocked) renderResources(); }
  btn.disabled = false; btn.textContent = t("wsSend");
});
$("#pblFiles").addEventListener("click", async e => {
  const b = e.target.closest("[data-pbldel]"); if (!b) return;
  const id = b.dataset.pbldel;
  if (state.wsDel !== id) { state.wsDel = id; renderPblFiles(); return; }
  b.disabled = true;
  try { await wsCall({ action: "delete", id }); state.ws = state.ws.filter(f => f.id !== id); state.wsDel = ""; renderPblFiles(); renderWsList(); }
  catch (err) { b.disabled = false; b.textContent = wsError(err); if (!state.unlocked) renderResources(); }
});
$("#wsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#wsMsg"), btn = $("#wsSubmit"), file = $("#wsFFile").files[0];
  const show = (txt, ok) => { msg.textContent = txt; msg.className = "ws-msg " + (ok ? "ok" : "bad"); };
  const title = $("#wsFTitle").value.trim(), grade = $("#wsFGrade").value, term = $("#wsFTerm").value, teacher = $("#wsFTeacher").value.trim();
  if (!title) return show(t("wsErr").NO_TITLE);
  if (!file) return show(t("wsErr").NO_FILE);
  if (file.size > CONFIG.WORKSHEET_MAX_MB * 1048576) return show(t("wsErr").TOO_BIG);
  try { localStorage.setItem("sd_ws", JSON.stringify({ grade, term, teacher })); } catch (x) {}
  btn.disabled = true; btn.textContent = t("wsSending"); msg.textContent = "";
  try {
    const data = await new Promise((ok, bad) => { const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = bad; r.readAsDataURL(file); });
    await wsCall({ action: "upload", grade, term, title, teacher, filename: file.name, mime: file.type, data });
    show(t("wsDone"), true);
    $("#wsFTitle").value = ""; $("#wsFFile").value = "";
    state.ws = null; state.wsGrade = grade; state.wsTerm = "all"; loadWs();
  } catch (err) { show(wsError(err)); }
  btn.disabled = false; btn.textContent = t("wsSend");
});
$("#calPrev").addEventListener("click", () => shiftMonth(-1));
$("#calNext").addEventListener("click", () => shiftMonth(1));
$("#calToday").addEventListener("click", () => { state.calY = 0; renderCalendar(); });

document.addEventListener("click", e => {
  const y = e.target.closest(".yt");
  if (y) {
    const inNotice = !!y.closest(".notices");
    const f = document.createElement("iframe");
    f.src = `https://www.youtube-nocookie.com/embed/${y.dataset.id}?autoplay=1&rel=0`;
    f.title = "YouTube video";
    f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    if (inNotice) f.addEventListener("load", fitNotices);
    y.replaceWith(f);
    if (inNotice) fitNotices();
    return;
  }
  const nd = e.target.closest(".n-dot");
  if (nd) { goNotice(Number(nd.dataset.i)); restartNoticeTimer(); return; }
  const m = e.target.closest(".more-toggle");
  if (m) {
    const p = m.previousElementSibling, open = p.classList.toggle("clamp");
    m.textContent = t(open ? "readMore" : "readLess");
  }
});

$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#passInput").value.trim();
  if (!v) return;
  if (!window.crypto?.subtle) { $("#lockErr").textContent = t("noCrypto"); return; }
  if (await sha256(v) === CONFIG.TEACHER_PASSCODE_HASH) {
    state.unlocked = true;
    state.pass = v;
    try { sessionStorage.setItem("sd_teacher", CONFIG.TEACHER_PASSCODE_HASH); sessionStorage.setItem("sd_pass", v); } catch (e) {}
    $("#passInput").value = ""; $("#lockErr").textContent = "";
    renderTeachers();
  } else {
    $("#lockErr").textContent = t("wrong");
    const box = $("#lockBox"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
  }
});
$("#lockBtn").addEventListener("click", () => {
  state.unlocked = false;
  state.pass = ""; state.ws = null;
  try { sessionStorage.removeItem("sd_teacher"); sessionStorage.removeItem("sd_pass"); } catch (e) {}
  renderTeachers();
});

$("#hashForm").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#hashInput").value.trim(); if (!v) return;
  if (!window.crypto?.subtle) { $("#hashOut").hidden = false; $("#hashOut").textContent = t("noCrypto"); return; }
  $("#hashOut").textContent = await sha256(v); $("#hashOut").hidden = false; $("#hashCopy").hidden = false;
  $("#hashCopy").textContent = t("copy");
});
$("#hashCopy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("#hashOut").textContent); $("#hashCopy").textContent = t("copied"); } catch (e) {}
});

render();
load();
</script>
</body>
</html>
